spring:
  application:
    name: helios-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/helios}
    username: ${DATABASE_USERNAME:helios_app}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. 'validate' checks entity mappings
      # against the actual migrated schema at startup and fails fast
      # on drift — Hibernate never generates/alters DDL itself.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_SIZE_BYTES:20971520}
      max-request-size: ${DOCUMENT_MAX_SIZE_BYTES:20971520}

document:
  storage:
    root: ${DOCUMENT_STORAGE_ROOT:./local-data/documents}
  upload:
    max-size-bytes: ${DOCUMENT_MAX_SIZE_BYTES:20971520}

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
